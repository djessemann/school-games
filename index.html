<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#d8d2c2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Games">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>School Games</title>
<meta name="description" content="Classic educational computer games, rebuilt for your phone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="canonical" href="https://djessemann.github.io/school-games/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="School Games">
<meta property="og:title" content="School Games">
<meta property="og:description" content="Classic educational computer games, rebuilt for your phone.">
<meta property="og:url" content="https://djessemann.github.io/school-games/">
<meta property="og:image" content="https://djessemann.github.io/school-games/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
/* same look as the games: black screen in a bezel, square keys with hard shadows */
:root {
  /* beige-gray computer case around the black screen, in light and dark mode alike (same as the games) */
  --page: #d8d2c2; --bezel: #2b2823; --key-bg: #ece6d6; --key-edge: #2b2823; --key-ink: #2b2823; --key-down-bg: #2b2823; --key-down-ink: #ece6d6;
  --gap: 8px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--page); overflow: hidden; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
/* always the upright phone layout; on a wide screen it sits in a phone-width column (shared/portrait.js covers a phone turned sideways) */
#app {
  position: fixed; inset: 0; display: flex; flex-direction: column; width: 100%; max-width: 480px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + var(--gap) + 6px) calc(env(safe-area-inset-right, 0px) + var(--gap))
           calc(env(safe-area-inset-bottom, 0px) + var(--gap)) calc(env(safe-area-inset-left, 0px) + var(--gap));
  gap: calc(var(--gap) * 2);
}
#screenwrap {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
  background: #000; border: 6px solid var(--bezel); height: calc((min(100vw, 480px) - 28px) * 192 / 280 + 12px); max-height: 50vh;
}
#screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#list {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; gap: calc(var(--gap) * 1.5); padding: 2px 3px 6px 2px; margin: 0; list-style: none;
}
.game {
  display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 10px 14px; text-decoration: none;
  background: var(--key-bg); border: 2px solid var(--key-edge); color: var(--key-ink);
  box-shadow: 3px 3px 0 var(--key-edge); margin: 0 3px 3px 0;
}
.game img { width: 48px; height: 48px; flex: 0 0 auto; image-rendering: pixelated; border: 2px solid var(--key-edge); background: #000; }
.game .label { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.game canvas { display: block; image-rendering: pixelated; pointer-events: none; }
.game.pressed { background: var(--key-down-bg); box-shadow: none; transform: translate(3px, 3px); }
.game.pressed canvas { filter: invert(1) sepia(.2); }
.game:focus-visible { outline: 2px dashed var(--key-ink); outline-offset: 3px; }
@media (min-height: 701px) {
  #app { padding-top: calc(env(safe-area-inset-top, 0px) + var(--gap) + 28px); }
}
</style>
</head>
<body>
<div id="app">
  <div id="screenwrap"><canvas id="screen" width="280" height="192" aria-label="School Games title screen"></canvas></div>
  <ul id="list" aria-label="Games"></ul>
</div>
<script src="shared/font.js"></script>
<script src="shared/portrait.js"></script>
<script>
// To add a game: put it in its own folder with an index.html and icons/icon-192.png, then add a line here.
const GAMES = [
  { path: 'munchers/', title: 'Word Munchers', icon: 'munchers/icons/icon-192.png' },
  { path: 'oregon/', title: 'The Oregon Trail', icon: 'oregon/icons/icon-192.png' },
  { path: 'odell/', title: 'Odell Lake', icon: 'odell/icons/icon-192.png' },
  { path: 'carmen/', title: 'Where in the World Is Carmen Sandiego?', icon: 'carmen/icons/icon-192.png' },
  { path: 'planets/', title: 'Planetary Construction Set', icon: 'planets/icons/icon-192.png' },
];

const FONT = Uint8Array.from(atob(FONT_B64), c => c.charCodeAt(0));
const ink = () => getComputedStyle(document.documentElement).getPropertyValue('--key-ink').trim() || '#fff';

// draw text in the Apple II font; one glyph is 7x8 pixels, bit 0 is the leftmost pixel
function drawText(g, text, x, y, k = 1, ky = k) {
  [...text].forEach((ch, i) => {
    const gi = ((ch.charCodeAt(0) & 0x7f) - 32) * 8;
    for (let r = 0; r < 8; r++) {
      const b = FONT[gi + r];
      for (let p = 0; p < 7; p++) if (b >> p & 1) g.fillRect(x + (i * 7 + p) * k, y + r * ky, k, ky);
    }
  });
}

// crisp text label for a key, sized in whole device pixels
function glyphLabel(text, s = 2) {
  const dpr = window.devicePixelRatio || 1, k = Math.max(1, Math.round(s * dpr));
  const c = document.createElement('canvas');
  c.width = text.length * 7 * k; c.height = 8 * k;
  c.style.width = (c.width / dpr) + 'px'; c.style.height = (c.height / dpr) + 'px';
  const g = c.getContext('2d'); g.fillStyle = ink();
  drawText(g, text, 0, 0, k);
  return c;
}

// split a title into lines of at most n characters
function wrap(text, n) {
  const out = [];
  for (const w of text.split(' ')) {
    const last = out[out.length - 1];
    if (last && (last + ' ' + w).length <= n) out[out.length - 1] = last + ' ' + w; else out.push(w);
  }
  return out;
}

// ---------- the title screen ----------
const scr = document.getElementById('screen'), sg = scr.getContext('2d');
const stars = Array.from({ length: 40 }, () => [Math.floor(Math.random() * 276) + 2, Math.floor(Math.random() * 188) + 2, Math.random() < 0.15]);
const center = (t, k = 1) => Math.floor((280 - t.length * 7 * k) / 2);
let tick = 0;
function drawScreen() {
  sg.fillStyle = '#000'; sg.fillRect(0, 0, 280, 192);
  sg.fillStyle = '#fff';
  // stars, a few of them twinkle
  for (const [x, y, tw] of stars) if (!tw || (tick + x) % 40 > 6) sg.fillRect(x, y, 1, 1);
  // double-line border
  sg.fillRect(4, 4, 272, 1); sg.fillRect(4, 187, 272, 1); sg.fillRect(4, 4, 1, 184); sg.fillRect(275, 4, 1, 184);
  sg.fillRect(7, 7, 266, 1); sg.fillRect(7, 184, 266, 1); sg.fillRect(7, 7, 1, 178); sg.fillRect(272, 7, 1, 178);
  // title in double height and double width, on a black band so stars don't run through it
  sg.fillStyle = '#000'; sg.fillRect(20, 40, 240, 76);
  sg.fillStyle = '#fff';
  drawText(sg, 'SCHOOL', center('SCHOOL', 2), 46, 2, 4);
  drawText(sg, 'GAMES', center('GAMES', 2), 82, 2, 4);
  sg.fillStyle = '#000'; sg.fillRect(40, 136, 200, 16);
  sg.fillStyle = '#fff';
  const pick = 'Pick a game';
  drawText(sg, pick, center(pick) - 4, 140);
  // blinking block cursor
  if (tick % 60 < 30) sg.fillRect(center(pick) - 4 + pick.length * 7 + 3, 140, 7, 8);
}
function layout() {
  const wrapEl = document.getElementById('screenwrap');
  const w = wrapEl.clientWidth - 12, h = wrapEl.clientHeight - 12;
  const s = Math.min(w / 280, h / 192);
  scr.style.width = Math.floor(280 * s) + 'px'; scr.style.height = Math.floor(192 * s) + 'px';
}
function frame() { tick++; if (tick % 3 === 0) drawScreen(); requestAnimationFrame(frame); }

// ---------- the game list ----------
function buildList() {
  const list = document.getElementById('list'); list.innerHTML = '';
  const avail = list.clientWidth - 48 - 14 - 32 - 10;   // room next to the icon
  const perLine = Math.max(8, Math.floor(avail / 14));
  for (const gm of GAMES) {
    const li = document.createElement('li');
    const a = document.createElement('a'); a.className = 'game'; a.href = gm.path; a.setAttribute('aria-label', gm.title);
    const img = document.createElement('img'); img.src = gm.icon; img.alt = '';
    const label = document.createElement('span'); label.className = 'label';
    for (const line of wrap(gm.title, perLine)) label.appendChild(glyphLabel(line));
    a.append(img, label);
    const up = () => a.classList.remove('pressed');
    a.addEventListener('pointerdown', () => a.classList.add('pressed'));
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => a.addEventListener(ev, up));
    li.appendChild(a); list.appendChild(li);
  }
}
// coming back with the Back button can restore the page with a key still pressed
window.addEventListener('pageshow', () => document.querySelectorAll('.game.pressed').forEach(a => a.classList.remove('pressed')));

let lastW = 0;
window.addEventListener('resize', () => {
  layout();
  const w = document.getElementById('list').clientWidth;
  if (w !== lastW) { lastW = w; buildList(); }
});
document.addEventListener('gesturestart', e => e.preventDefault());
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
layout(); lastW = document.getElementById('list').clientWidth; buildList(); drawScreen(); requestAnimationFrame(frame);
</script>
</body>
</html>
