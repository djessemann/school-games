<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#d8d2c2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Games">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Word Munchers</title>
<meta name="description" content="Munch the words with the right vowel sound, and watch out for Troggles. The 1985 MECC classic, on your phone.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="canonical" href="https://djessemann.github.io/school-games/munchers/">
<link rel="stylesheet" href="../shared/disk-game.css">
</head>
<body>
<div id="app">
  <div id="screenwrap"><canvas id="screen" width="280" height="192" aria-label="Game screen"></canvas></div>
  <div id="deck">
    <div id="dmain">
      <div class="dpad">
        <button class="key up" type="button" data-key="11" data-rep aria-label="Up" data-label="#"></button>
        <button class="key left" type="button" data-key="8" data-rep aria-label="Left" data-label="&"></button>
        <button class="key right" type="button" data-key="21" data-rep aria-label="Right" data-label="{"></button>
        <button class="key down" type="button" data-key="10" data-rep aria-label="Down" data-label="$"></button>
      </div>
      <button id="bigKey" class="key" type="button" aria-label="Munch" data-label="Munch"></button>
    </div>
    <form id="nameBox" hidden autocomplete="off">
      <div id="nameLabel" aria-hidden="true"></div>
      <div class="row">
        <input id="nameInput" type="text" maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" aria-label="Your name for the Hall of Fame">
        <button id="nameOk" class="key" type="submit" aria-label="OK" data-label="OK"></button>
      </div>
    </form>
    <div id="dbar" data-row>
      <button id="gamesKey" class="key" type="button" aria-label="Back to all games" data-label="Games"></button>
      <button class="key" type="button" data-key="63" aria-label="Pause" data-label="Pause"></button>
      <button class="key" type="button" data-key="27,27" aria-label="Quit this game" data-label="Quit"></button>
    </div>
  </div>
</div>
<script src="../shared/font.js"></script>
<script src="../shared/portrait.js"></script>
<script src="../shared/cpu6502.js"></script>
<script src="../shared/apple2.js"></script>
<script src="../shared/disk-game.js"></script>
<script>
'use strict';
// Where the game reads the keyboard tells us what it is waiting for:
const READ_MENU = 0x1248, READ_YES_NO = 0x1eb1;   // main menu and Yes/No prompts: Return picks
const READ_PLAY = 0x9ad9;                         // playing: Space munches
const READ_NAME = 0x8374;                         // Hall of Fame name entry
// ("Press SPACE BAR to continue" screens read elsewhere and want Space.)

DiskGame.start({
  disk: 'munchers.dsk',
  saveKey: 'munchers-disk',
  // Phones have no joystick, so skip the game's "play with a joystick?" question.
  // The routine that asks it (track 11, sector 9) becomes: LDA #0 (keyboard), STA $9C84, RTS.
  patch(dsk) {
    const at = 11 * 4096 + 9 * 256 + 0xa1, ask = [0xad, 0x84, 0x9c, 0x10, 0x4e, 0xa9];
    if (ask.every((b, i) => dsk[at + i] === b)) dsk.set([0xa9, 0x00, 0x8d, 0x84, 0x9c, 0x60], at);
  },
  // One big button does the job of both Space and Return.
  bigKey(m) {
    const code = m.kbdPC === READ_MENU || m.kbdPC === READ_YES_NO ? 13 : 32;
    return { code, label: m.kbdPC === READ_PLAY ? 'Munch' : 'OK' };
  },
  namePrompt: m => m.kbdPC === READ_NAME,
});
</script>
</body>
</html>
