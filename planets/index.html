<style>
:root {
  /* beige-gray computer case around the black screen, in light and dark mode alike */
  --page: #d8d2c2; --bezel: #2b2823; --key-bg: #ece6d6; --key-edge: #2b2823; --key-ink: #2b2823; --key-down-bg: #2b2823; --key-down-ink: #ece6d6;
  --gap: 8px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--page); overflow: hidden; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
#app {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + var(--gap)) calc(env(safe-area-inset-right, 0px) + var(--gap))
           calc(env(safe-area-inset-bottom, 0px) + var(--gap)) calc(env(safe-area-inset-left, 0px) + var(--gap));
  gap: var(--gap);
}
#screenwrap {
  flex: 0 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center;
  background: #000; border: 6px solid var(--bezel); height: calc((100vw - 28px) * 192 / 280 + 12px); max-height: 62vh;
}
#screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
#deck { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); }
#dmain { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: var(--gap); }
#dbar { flex: 0 0 auto; display: flex; gap: var(--gap); }
#dutil { flex: 1 1 auto; display: flex; gap: var(--gap); }
#dutil .key { flex: 1 1 0; }
#dutil .key.ret { flex: 2 1 0; }
.key {
  display: flex; align-items: center; justify-content: center; min-width: 52px; min-height: 52px; padding: 6px 10px;
  background: var(--key-bg); border: 2px solid var(--key-edge); border-radius: 0; color: var(--key-ink); cursor: pointer;
  box-shadow: 3px 3px 0 var(--key-edge); font: inherit; margin: 0 3px 3px 0;
}
.key canvas { display: block; image-rendering: pixelated; pointer-events: none; }
.key.pressed { background: var(--key-down-bg); box-shadow: none; transform: translate(3px, 3px); }
.key.pressed canvas { filter: invert(1) sepia(.2); }
.key:focus-visible { outline: 2px dashed var(--key-ink); outline-offset: 3px; }
#menuKey { flex: 0 0 auto; margin-right: calc(3px + var(--gap)); }
#dbar .key { min-width: 0; padding-left: 4px; padding-right: 4px; }
.dpad { display: grid; gap: var(--gap); }
.dpad .key { width: 64px; height: 56px; }
.dpad.cross { grid-template-areas: ". up ." "left . right" ". down ."; }
.dpad.lr { grid-template-areas: "left right"; }
.dpad.lr .key { width: 96px; }
.dpad.ud { grid-template-areas: "up down"; }
.dpad.ud .key { width: 96px; }
.dpad .up { grid-area: up; } .dpad .down { grid-area: down; } .dpad .left { grid-area: left; } .dpad .right { grid-area: right; }
.keypad { display: grid; grid-template-columns: repeat(3, 64px); gap: var(--gap); }
.keypad .key { height: 48px; min-height: 44px; }
.digits { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap); max-width: 100%; }
.digits .key { width: clamp(44px, calc((100vw - 90px) / 6), 72px); }
.yn { display: flex; gap: var(--gap); }
.yn .key { min-width: 110px; }
.spacer { width: 64px; }
/* landscape: controls to the right of the screen */
@media (orientation: landscape) {
  #app { flex-direction: row; }
  #screenwrap { flex: 1 1 auto; height: auto; max-height: none; }
  #deck { flex: 0 0 min(360px, 45vw); }
  #dbar { flex-wrap: wrap; }
  .keypad { grid-template-columns: repeat(3, 56px); }
  .keypad .key { height: 42px; min-height: 40px; }
  .dpad .key { width: 56px; height: 48px; }
}
@media (orientation: landscape) and (max-height: 420px) {
  .key { min-height: 40px; padding: 4px 8px; }
  .keypad .key { height: 36px; min-height: 34px; }
  .dpad .key { height: 40px; }
}
/* portrait: breathing room below the status bar / Dynamic Island (there is spare height) */
@media (orientation: portrait) {
  #app { padding-top: calc(env(safe-area-inset-top, 0px) + var(--gap) + 6px); }
}
@media (orientation: portrait) and (min-height: 701px) {
  #app { padding-top: calc(env(safe-area-inset-top, 0px) + var(--gap) + 28px); }
  .keypad { grid-template-columns: repeat(3, 78px); }
  .keypad .key { height: 56px; }
  .dpad .key { width: 78px; height: 64px; }
  .dpad.lr .key, .dpad.ud .key { width: 110px; }
  .digits .key { height: 60px; }
  .yn .key { min-height: 60px; }
}
@media (orientation: portrait) and (max-height: 700px) {
  .keypad .key { height: 42px; }
  .key { min-height: 44px; }
}
</style>

  </div>
</div>

async function START() {

  let skip = false;

    const D = (A === 1 || A === 4) ? 2 : -2;

    }

  }
  flushKeys();
  if (skip) throw new Run('MUN');   // Start tapped during the animation: go straight in
  WT = 20; clearWin(); WT = 0;
  vtab(22); htab(2); pn("Designed by:  Thomas C. O'Brien III"); htab(16); pn('and Michael L. Roney');
  await getKey({ any: true, menuOff: true, hot: [{ x0: 0, y0: 0, x1: 280, y1: 192, k: [13] }] });

  for (;;) {
    if (FC !== 1) {
      clrw(); vtab(1); htab(4); pr('           Main Menu          ');
      const items = ["1) Cadet's Briefing", "2) Cadet's Mission", "3) Captain's Briefing", "4) Captain's Mission", '5) Descriptions', '6) End'];
      vtab(10); items.forEach((t, i) => { htab(10); pn(t); if (i < 5) pn(); });
      htab(4); vtab(6); pr('Which would you like? ', chr(127));
      const hr = items.map((t, i) => rowHot(10 + i * 2, 9, 32, [49 + i, 13]));
      const B = await menuInput(6, 26, 6, hr, { menuOff: true });
      clrw(); vtab(4);
      FC = VAL(B);

      if (FC === 6) { await theEnd(); return; }
      if (FC !== 1) {

      }

    htab(4); vtab(6); pr('Which would you like? ', chr(127));
    const sub = ['1) Measurement Briefing', '2) Star Briefing', '3) Planet Briefing', '4) Return to Main Menu'];
    vtab(10); sub.forEach((t, i) => { htab(10); pn(t); if (i < 3) pn(); });
    const B = await menuInput(6, 26, 4, sub.map((t, i) => rowHot(10 + i * 2, 9, 34, [49 + i, 13])), { esc: true });
    clrw(); vtab(4);
    const f = B === 'esc' ? 4 : VAL(B);
    if (f === 4) { G.p8040 = 0; throw new Run('MUN'); }
    throw new Run({ 1: 'MEASURE', 2: 'ASTRONOMY', 3: 'PLANETS' }[f]);
  }
}

      C10h(); htab(H); vtab(3); pr(r[0]);
      if (HP !== 6) { vtab(5); htab(7); pr(r[4], ' planet from the Sun.'); }
      htab(4); vtab(8); pr('Distance from The Sun: ', r[1], ' AU'); if (HP !== 8) pr('s');
      htab(4); vtab(10); pr('Mass: ', r[2], ' Earth Mass'); if (r[2] !== '1') pr('es');
      htab(4); vtab(12); pr('Composition: ', r[5]); vtab(14); htab(4); pr('Atmosphere Composition: ', r[6]);
      htab(4); vtab(16); pr('Inclination of rotation: ', r[3], '~');
      await waitRet(false); C10h();
    }
  }
}

// ---------- LIFEHELP: Captain's Briefing (life, phyla, classes, environment quiz) ----------
async function LIFEHELP() {
  memReset(); cls(); DBL = false;
  bload('ASSORTED', 0x1000);
  const LH = D.LH, PV = LH.PV, CV = LH.CV, AN = LH.AN, DE = LH.DE, EN = LH.EN;
  const PH = [, 'Porifera', 'Cnidaria', 'Platyhelminthes', 'Mollusca', 'Arthropoda', 'Echinodermata', 'Chordata'];
  const CL$ = ['Osteichthyes', 'Amphibia', 'Reptilia', 'Aves', 'Mammalia'];
  const C1 = () => { clrw(1, 23, 0, 40); };      // GOSUB 10000 here: rows 2-23, full width
  const pg = async (arr, pre) => { if (pre) pre(); lines(arr); const bs = await waitRet(true); C1(); return bs; };
  const odd = n => (n & 1) ? 1 : 0;

  // 3500: intro pages
  vtab(1); htab(11); pr("Captain's Briefing");
  const intro = [
    () => pg(['Scientists have divided all living', 'organisms into different groups', 'on the basis of their', 'physical structure.',
      '^These divisions are used by', 'scientists to classify organisms', "based on the organism's complexity."], () => vtab(4)),
    () => pg(['The first major division that', "scientists use is called the 'Kingdom'.", 'There are 3 Kingdoms:', '^Kingdom Protista  (Protozoa, Amoebas) ',
      'Kingdom Plantae   (Plants)            ', 'Kingdom Animalia  (All Animals)       '], () => vtab(4)),
    () => pg(['Each of the kingdoms is divided into', "'Phyla'.  In kingdom Animalia there are:", 'Phylum Porifera          (Sponges)    ',
      'Phylum Cnidaria          (Jellyfish)  ', 'Phylum Platyhelminthes   (Flatworms)  ', 'Phylum Mollusca          (Molluscs)   ',
      'Phylum Arthropoda        (Insects)    ', 'Phylum Echinodermata     (Starfish)   ', 'Phylum Chordata          (Fish, Man)  '], () => vtab(4)),
    () => pg(['The key idea in the life briefing', 'is that in life on Earth, STRUCTURE,', 'FUNCTION, and ENVIRONMENT are all', 'closely related.  All life has',
      'characteristics, or STRUCTURES, that', 'help the organism FUNCTION and live', 'in its particular ENVIRONMENT.', 'For each section, try to come up with',
      'organisms that you are familiar with.'], () => { C1(); vtab(4); }),
    () => pg(['You will now be given a list of', 'phyla to investigate.', 'Use the &  and  { keys to pick', 'a Phylum to study, then tap OK.',
      '^When you select Phylum Chordata,', 'the list of Phyla will be replaced', "with a list of 'Classes' that are", 'under Phylum Chordata.'], () => vtab(4)),
  ];
  { let i = 0; while (i < intro.length) { const bs = await intro[i](); if (bs) { if (i === 0) { await pleaseWait(); throw new Run('MUN'); } i--; } else i++; } }

  let VT = 6, OV = 6, OH = 0, CL = 0;
  const trunk = () => { hcolor(7); hplot(140, 168, 140, 0, 139, 0, 139, 168, 138, 168, 138, 0, 141, 0, 141, 168); };
  const arrowOR = (y, x) => { blitMode = 'or'; blit(y, x, 13, 2, 24, 0x1012); blitMode = 'copy'; };
  const instructions = () => { vtab(22); htab(5); pn('Use the &  { keys to move arrow.'); htab(5); pn('Tap OK to make a selection.'); htab(9); pr('Tap Go On for the quiz.'); };

  function drawPhyla() {   // 80, 85
    cls();
    for (let a = 0; a <= 6; a++) { const C = odd(a) * 5; blit(153 - 24 * a, 19 - (C ? 3 : 0), 18, 3, 28, 0x1100 + 131 + C); }
    trunk();
    let d = 0;
    for (let a = 0; a <= 15; a += 3) {
      const C = odd(a) * 3; blit(153 - 8 * a, 23 - (C ? 10 : 0), 13, 2, 24, 0x1000 + a);
      const HT = C ? 4 : 26; d++;
      vtab(18 - a); htab(HT); pr('Phylum'); vtab(19 - a); htab(HT); pr(PH[d]);
      htab(26); vtab(1); pr('Phylum'); htab(26); vtab(2); pr(PH[7]);
    }
  }
  function drawClasses() {  // 4000
    cls();
    for (let a = 0; a <= 5; a++) { const C = odd(a) * 5; blit(153 - 28 * a, 19 - (C ? 3 : 0), 18, 3, 28, 0x1100 + 131 + C); }
    trunk();
    let TC = 0;
    for (let a = 0; a <= 15; a += 5) {
      const B = 136 - 28 * a / 5, C = (1 - odd(a)) * 5;
      let TE = INT(25 - (C ? 15 : 0));
      if (a === 0) blit(B, TE + 1, 18, 3, 28, 0x1100 + 56);
      else blit(B, TE, 18, 4, 28, 0x1100 + 55 + a);
      TE = INT(26 - (C ? 22 : 0)); const c = C ? 1 : 0, TR = INT(B / 8) - 1;
      htab(TE); vtab(TR - c); pr('Class'); vtab(TR + 1 - c); htab(TE); pr(CL$[TC]); TC++;
    }
    htab(4); vtab(2); pr('Class'); vtab(3); htab(4); pr(CL$[4]);
    htab(26); vtab(19); pr('Return to'); vtab(20); htab(26); pr('Phylum Menu');
  }
  function placeArrow() {   // 95-97 / 4050-4060
    if (CL === 1) {
      const G = odd(CV[VT]);
      let HT = INT(24 - G * 22); if (VT < 4 || VT === 6) HT = INT(24 - (1 - G) * 22);
      htab(OH - (OH ? 1 : 0)); vtab(CV[OV]); pr('   '); OH = HT; OV = VT;
      htab(OH - (OH ? 1 : 0) + 1); vtab(CV[OV] + 1); pr(' ');
      let B = CV[OV] * 8 + 9; if (B < 20) B = 20;
      arrowOR(B - 20, odd(OV) ? 0 : 22);
    } else {
      const G = odd(PV[VT]); let HT = INT(24 - G * 22); if (VT === 0) HT = 24;
      htab(OH - (OH ? 1 : 0)); vtab(PV[OV]); pr('   '); htab(OH - (OH ? 1 : 0) + 1); vtab(PV[OV] + 1); pr(' ');
      OH = HT; OV = VT; const HP = 6 - VT;
      let B = 153 - 24 * HP; if (B < 20) B = 20;
      arrowOR(B - 20, odd(HP) ? 0 : 22);
    }
  }
  // tap targets on the tree labels
  function treeHot() {
    const hs = [];
    for (let v = CL ? 1 : 0; v <= 6; v++) {
      const row = CL ? CV[v] : PV[v];
      let left;
      if (CL) left = odd(v) === 1; else left = odd(6 - v) === 1;
      const x0 = left ? 0 : 154, x1 = left ? 136 : 280;
      hs.push({ x0, x1, y0: (row - 2) * 8, y1: (row + 1) * 8 + 2, k: () => {
        const ks = []; for (let i = VT; i < v; i++) ks.push(10); for (let i = VT; i > v; i--) ks.push(11); ks.push(13); pushKey(...ks);
      } });
    }
    return hs;
  }

  let redraw = true;
  for (;;) {
    if (redraw) { if (CL) drawClasses(); else drawPhyla(); instructions(); redraw = false; }
    placeArrow();
    let k;
    for (;;) {
      k = await getKey({ ud: true, ret: true, esc: true, escLabel: 'Go On', hot: treeHot() });
      if (k === 27) { await quiz(); return; }
      if ([8, 11, 65, 97].includes(k)) { if (CL === 1 && VT === 1) continue; if (VT > 0) { VT--; break; } continue; }
      if ([21, 10, 122, 90].includes(k)) { if (VT < 6) { VT++; break; } continue; }
      if (k === 13) break;
    }
    if (k !== 13) continue;
    if (CL === 1 && VT === 6) { VT = 0; CL = 0; redraw = true; continue; }
    cls();
    if (CL === 1) { await classPage(6 - VT); drawClasses(); instructions(); continue; }
    const C = 7 - VT;
    if (C === 7) { CL = 1; VT = 6; drawClasses(); instructions(); continue; }
    await phylumPage(C); redraw = true;
  }

  async function phylumPage(c) {
    const P = {
      1: ['Phylum Porifera', 13, ['Example: Sponges                   ', 'Structure: Pores that filter       ', 'Function: Filtering food           ', 'Environment: Oceans                ',
        '^Sponges are sessile (stationary) and', "feed by 'filtering' material that", 'passes through the sponge.']],
      2: ['Phylum Cnidaria', 12, ['Example: Jellyfish                 ', 'Structure: Simple muscles, simple  ', 'nervous system, and stinging cells ', 'Function: Catching food            ',
        'Environment: Oceans, lakes         ', '^Some Cnidarians are motile (mobile)', 'while the majority are sessile.']],
      3: ['Phylum Platyhelminthes', 9, ['Example: Flatworms                 ', 'Structure: Simple eyes, cilia      ', 'Function: Locating and eating food ', 'Environment: Streams, ponds,       ',
        'anywhere organic garbage is found  ', '^Flatworms propel themselves by means', 'of cilia on their undersides which', 'allow them great mobility.']],
      4: ['Phylum Mollusca', 12, ['Examples: Snail, Squid, Clam       ', 'Structure: Simple organs for touch,', 'smell, and taste                    ', 'Function: Locating and eating food ',
        'Environment: Mollusks live both on ', 'land and in water                  ', '^Most, though not all, Mollusks', "have a hard 'limy' covering."]],
      5: ['Phylum Arthropoda', 13, ['Examples: Lobster, Spider, Bee     ', 'Structure: Exoskeleton, jointed    ', 'legs, muscles capable of rapid     ', 'action, and antennae               ',
        'Function: Protection, rapid motion,', 'locating prey, and feeding         ', 'Environment: Land, water, and air; ', 'anywhere food is available         ']],
      6: ['Phylum Echinodermata', 10, ['Example: Starfish                  ', 'Structure: Head, tube feet and a   ', 'diffuse nervous system             ', 'Function: clinging to rocks, eating',
        'Environment: Ocean, edge of ocean  '], 5],
    }[c];
    vtab(1); htab(P[1]); pr(P[0]); vtab(P[3] || 4); lines(P[2]);
    await waitRet(false); C1();
  }
  async function classPage(c) {
    const T = (t, h) => () => { vtab(1); htab(h); pr(t); vtab(4); };
    const V4 = () => vtab(4);
    const S = {
      1: [[T('Class Osteichthyes', 11), ['Class Osteichthyes, bony fish, is', 'the simplest Chordate Class that we', 'shall consider.  Bony fish usually', 'have scales (less water resistance),',
        'lidless eyes, fins, and a', 'relatively complex brain with', 'a well developed Cerebellum', '(Coordination center of the brain).']],
        [V4, ['Examples: Goldfish, Cod, Trout     ', 'Structure: Scales, Narrow body,    ', 'and a well developed brain         ', 'Function: Survival with competition',
          'Environment: Bodies of water       ', '^Fish come in an enormous variety', 'of shapes and colors depending on', "the fish's habitat."]]],
      2: [[T('Class Amphibia', 13), ['Amphibians (frogs, salamanders and', 'the like) are more advanced than the', 'bony fish in that they have adapted', 'to both land AND water environments.',
        '^All Amphibians have two pairs of', 'limbs that can be used on land (and', 'in water), eyelids, variable', 'body temperature, and lungs.']],
        [V4, ['Examples: Frog, Salamander, Newt   ', 'Structures: Lungs, webbed feet, and', 'lidded eyes                        ', 'Function: Survival on both land and',
          'in water                           ', 'Environment: Both land and water   ', '^Amphibians are able to function well', 'on land and in water.']]],
      3: [[T('Class Reptilia', 13), ['Reptiles, as a group, have moved', 'completely out of the water and can', 'live solely on the land.', '^Since most reptiles live solely on',
        'land, they have dry scaly skin that', 'is ideal for keeping water in.', 'Reptiles, like Amphibians, have', 'variable body temperatures.']],
        [V4, ['Examples: Snake, Turtle, Alligator ', 'Structures: Scales, dry scaly skin,', 'lungs, and a complicated heart     ', 'Function: Survival on land         ',
          'despite competition                ', 'Environment: Most live only on land', 'while some also live in water.     ']]],
      4: [[T('Class Aves', 15), ['The Class Aves (birds) is very', 'different from any other Class.', '^All birds are covered with feathers,', 'they have two pairs of limbs, one',
        'pair of which is usually wings,', 'the other of which is usually used', 'for perching.  Birds have a constant', 'body temperature.']],
        [V4, ['Examples: Duck, Penguin, Robin     ', 'Structures: Wings, constant body   ', 'temperature, highly efficient lungs', 'Function: Flying, perching,        ',
          'and, sometimes, swimming           ', 'Environment: Land, water, and air  ', '^While most birds can fly, some can', 'not fly but live on land or in water.']]],
      5: [[T('Class Mammalia', 13), ['Finally we arrive at Mammals, a', 'diverse group containing everything', 'from bats to whales.', '^Even though mammals are the most',
        'advanced of all the animals, there', 'is a great deal of specialization', 'within the Class Mammalia.', '^Following are some special features.']],
        [V4, ['Some of the special characteristics', 'that some mammals have are:', '^Armor            (for defense)         ', 'Claws            (catching prey)       ',
          'Coloration       (camouflage)          ', 'Hibernation      (survival during cold)', 'Insulative Fat   (survival during cold)',
          'Long ears        (hearing and ridding  ', '                  excess heat)         ']],
        [V4, ['More characteristics of Mammals.', '^Long tongue      (acquiring food)      ', 'Narrow body      (evading predators)   ', 'Parachutes       (evading predators)   ',
          'Prehensile tail  (grasping things)     ', 'Sonar            (navigating in dark)  ', 'Water storage    (survival in drought) ', 'Wings            (acquiring food)      ']],
        [V4, ['This is not a complete list of the', 'special characteristics of mammals,', 'but is intended to give you an idea', 'of the different structures that',
          'exist, each of which has a function.', '^In answering the questions that follow,', 'keep in mind how the structure,', 'function, and environment are related.']]],
    }[c];
    let i = 0;
    while (i < S.length) {
      const bs = await pg(S[i][1], S[i][0]);
      if (bs) { if (i === 0) { cls(); return; } i--; } else i++;
    }
    cls();
  }

  async function quiz() {    // 2600
    cls(); vtab(1); htab(12); pr('Environment Quiz');
    const NQ = INT(RND() * 4) + 4, QN = [];
    for (let a = 1; a <= NQ; a++) QN[a] = INT(RND() * 18);
    let q = 0, NT = 0, CR = 0; const CRs = [0, 0, 0];
    for (;;) {
      q++; if (q >= NQ) break;
      for (;;) {
        const n = QN[q];
        vtab(4); htab(4); pr('Example: ', AN[n]); vtab(6); htab(4); pr('Structure: ', DE[n]); vtab(8); htab(4); pr('Environment: ???');
        vtab(11); htab(4); pn('Which of the following is'); htab(4); pr('the most likely environment? ', chr(127));
        if (NT === 0) {
          CR = INT(RND() * 3); CRs[CR] = n;
          let NR; do { NR = INT(RND() * 3); } while (NR === CR);
          do { CRs[NR] = INT(RND() * 17); } while (CRs[NR] === CRs[CR] || EN[CRs[NR]] === EN[CRs[CR]]);
          let LR; do { LR = INT(RND() * 3); } while (LR === CR || LR === NR);
          do { CRs[LR] = INT(RND() * 17); } while (CRs[LR] === CRs[CR] || CRs[LR] === CRs[NR] || EN[CRs[LR]] === EN[CRs[CR]] || EN[CRs[LR]] === EN[CRs[NR]]);
        }
        htab(8); vtab(14); pn('1) ', EN[CRs[0]]); pn(); htab(8); pn('2) ', EN[CRs[1]]); pn(); htab(8); pr('3) ', EN[CRs[2]]);
        const B = await menuInput(12, 33, 3, [14, 16, 18].map((r, i) => rowHot(r, 7, 38, [49 + i, 13])));
        if (VAL(B) === CR + 1) { htab(16); vtab(21); pr('Very Good!'); await waitRet(false); C1(); NT = 0; break; }
        if (NT > 0) {
          const t = EN[CRs[CR]]; htab(INT((40 - t.length - 20) / 2 + 1)); vtab(21); pr('The best answer is ', t);
          NT = 0; await waitRet(false); C1(); break;
        }
        htab(12); vtab(21); pr('Sorry, try again.'); NT++; await waitRet(false); C1();
      }
    }
    cls(); vtab(10); htab(12); pr('Please Wait...'); await sleep(250);
    throw new Run('MUN');
  }
}
